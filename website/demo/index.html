<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在线观看 SupplyMind AI RC12 全模块功能演示：人工录入、文件导入、历史回填、预警与云端 Agent 分析。普通话男声讲解，中文字幕。">
  <title>SupplyMind AI · 全流程演示</title>
  <style>
    :root { color-scheme: light; --ink:#102e48; --blue:#1c6ee0; --paper:#f1f5fa; --line:#d6e0eb; --muted:#587086; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.65 "Segoe UI","Microsoft YaHei",sans-serif; }
    a { color:var(--blue); text-underline-offset:4px; }
    a:focus-visible,button:focus-visible,video:focus-visible { outline:3px solid #eb9c25; outline-offset:4px; }
    header { background:var(--ink); color:white; }
    .bar { max-width:1240px; margin:auto; padding:19px 28px; display:flex; justify-content:space-between; gap:20px; align-items:center; }
    .brand { font:700 23px Georgia,serif; letter-spacing:-.5px; }
    .brand span { color:#90c3ff; }
    header a { color:#dceaff; font-size:14px; }
    main { max-width:1240px; margin:auto; padding:38px 28px 20px; }
    .intro { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:22px; }
    .eyebrow { color:var(--blue); font:600 12px/1.5 Consolas,monospace; letter-spacing:1.4px; margin:0 0 8px; }
    h1 { font-size:clamp(25px,3.8vw,38px); line-height:1.3; margin:0; letter-spacing:-1px; }
    .lead { color:var(--muted); margin:10px 0 0; font-size:15px; }
    .duration { color:var(--muted); white-space:nowrap; font:14px Consolas,monospace; padding-bottom:4px; }
    .screen { background:#081b2b; border-radius:10px; overflow:hidden; box-shadow:0 14px 40px #18394e14; }
    video { width:100%; display:block; aspect-ratio:1280/816; background:#081b2b; }
    .play-note { background:white; padding:13px 18px; font-size:14px; border:1px solid var(--line); border-top:0; border-radius:0 0 10px 10px; margin-top:-8px; position:relative; color:var(--muted); }
    .chapter-header { display:flex; gap:16px; align-items:baseline; margin:28px 0 12px; }
    h2 { font-size:18px; margin:0; }
    .chapter-header p { color:var(--muted); margin:0; font-size:13px; }
    .chapters { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
    button { font:inherit; text-align:left; background:white; border:1px solid var(--line); border-radius:7px; padding:13px 15px; cursor:pointer; color:var(--ink); }
    button:hover { border-color:var(--blue); background:#eaf2ff; }
    button[aria-current="true"] { border-color:var(--blue); box-shadow:inset 3px 0 var(--blue); }
    button time { display:block; font:12px/1.6 Consolas,monospace; color:var(--blue); margin-bottom:2px; }
    .disclaimer { margin:24px 0 0; color:var(--muted); font-size:13px; border-left:3px solid #a8bdd0; padding-left:12px; }
    footer { max-width:1240px; padding:18px 28px 32px; margin:auto; display:flex; flex-wrap:wrap; gap:12px 24px; font-size:13px; }
    @media(max-width:740px) { .chapters { grid-template-columns:repeat(2,minmax(0,1fr)); } main { padding:25px 16px 12px; } .bar,footer { padding-left:16px; padding-right:16px; } .intro { display:block; } .duration { display:block; margin-top:10px; } .chapter-header { display:block; } }
  </style>
</head>
<body>
  <header><div class="bar"><div class="brand">SupplyMind <span>AI</span></div><a href="https://github.com/osasukev57-venn/SupplyMind-AI">查看项目源码 ↗</a></div></header>
  <main>
    <div class="intro"><div><p class="eyebrow">RC12 / 实际操作录像</p><h1>从数据录入，到有据可查的分析。</h1><p class="lead">全模块演示 · 普通话 AI 男声讲解 · 内嵌中文字幕</p></div><span class="duration">05:49 / Windows 桌面端</span></div>
    <div class="screen"><video id="demo" controls playsinline preload="metadata" aria-label="SupplyMind AI RC12 全模块功能演示" poster="https://raw.githubusercontent.com/osasukev57-venn/SupplyMind-AI/main/docs/images/rc12/overview.jpg"><source src="https://github.com/osasukev57-venn/SupplyMind-AI/releases/download/v0.9.1-rc.12/SupplyMindAI-RC12-demo-zh-CN-male.mp4" type="video/mp4">浏览器不支持视频播放，请使用页面下方的备用下载入口。</video></div>
    <p id="play-status" class="play-note" role="status">点击画面中的播放按钮即可观看，无需先下载。支持全屏；也可选择下方章节。</p>
    <div class="chapter-header"><h2>按功能观看</h2><p>点击时间，跳到对应操作。</p></div>
    <nav class="chapters" aria-label="视频章节">
      <button data-time="0"><time>00:00</time>总览、历史与质量</button>
      <button data-time="28"><time>00:28</time>新增监测项</button>
      <button data-time="60"><time>01:00</time>人工录入与发布</button>
      <button data-time="78"><time>01:18</time>历史回填闭环</button>
      <button data-time="123"><time>02:03</time>文件导入与发布</button>
      <button data-time="170"><time>02:50</time>预警规则与确认</button>
      <button data-time="240"><time>04:00</time>云端 Agent 分析</button>
      <button data-time="306"><time>05:06</time>保存与重新读取报告</button>
    </nav>
    <p class="disclaimer">AZ91D 录像数据为模拟数据，不代表真实市场行情或风险。确认预警表示已知悉，不表示风险消失。云端解读仅作分析辅助。</p>
  </main>
  <footer><a href="https://github.com/osasukev57-venn/SupplyMind-AI/releases/tag/v0.9.1-rc.12">下载 RC12 运行包</a><a href="https://github.com/osasukev57-venn/SupplyMind-AI/blob/main/README.md">完整功能说明</a><a href="https://github.com/osasukev57-venn/SupplyMind-AI/releases/download/v0.9.1-rc.12/SupplyMindAI-RC12-demo-zh-CN-male.mp4">备用：下载视频</a></footer>
  <script>
    const video = document.getElementById('demo');
    const status = document.getElementById('play-status');
    const chapters = [...document.querySelectorAll('[data-time]')];
    let pendingTime = null;
    function startAt(time) {
      video.currentTime = time;
      video.play().catch(() => { status.textContent = '已定位到所选章节，请点击播放器中的播放按钮。'; });
    }
    chapters.forEach(button => button.addEventListener('click', () => {
      const time = Number(button.dataset.time);
      if (video.readyState >= 1) startAt(time);
      else { pendingTime = time; video.load(); status.textContent = '正在载入视频，随后跳到所选章节。'; }
    }));
    video.addEventListener('loadedmetadata', () => { if (pendingTime !== null) { startAt(pendingTime); pendingTime = null; } });
    video.addEventListener('playing', () => { status.textContent = '正在播放 · 中文字幕已内嵌于视频，支持全屏观看。'; });
    video.addEventListener('error', () => { status.textContent = '视频未能载入，请刷新重试或检查 GitHub 网络连接。页面下方保留了备用下载入口。'; });
    video.addEventListener('timeupdate', () => {
      const active = [...chapters].reverse().find(button => Number(button.dataset.time) <= video.currentTime);
      chapters.forEach(button => { if (button === active) button.setAttribute('aria-current', 'true'); else button.removeAttribute('aria-current'); });
    });
  </script>
</body>
</html>
