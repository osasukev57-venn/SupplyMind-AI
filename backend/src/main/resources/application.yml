spring:
  application:
    name: supplymind-backend
  main:
    web-application-type: servlet

supplymind:
  data-root: ${user.dir}/data
  manual:
    # DEC-057 P0 single-operator rule: the operatorRef is server-side configured (authentication
    # context), never client-supplied. The local desktop default is a controlled single operator;
    # set it to empty to disable manual intake fail-closed.
    operator-ref: ${SUPPLYMIND_MANUAL_OPERATOR_REF:local-operator}
  agent:
    llm:
      enabled: ${SUPPLYMIND_LLM_ENABLED:false}
      provider: ${SUPPLYMIND_LLM_PROVIDER:openai-compatible}
      model: ${SUPPLYMIND_LLM_MODEL:}
      base-url: ${SUPPLYMIND_LLM_BASE_URL:}
      api-key: ${SUPPLYMIND_LLM_API_KEY:}
      completions-path: ${SUPPLYMIND_LLM_COMPLETIONS_PATH:/v1/chat/completions}
      timeout: ${SUPPLYMIND_LLM_TIMEOUT:90s}
